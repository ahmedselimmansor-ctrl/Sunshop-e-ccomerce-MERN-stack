# Storefront static hosting.
#
# CloudFront sits in front of this in production, so the cache headers here are
# what the edge obeys. The two rules that matter:
#   • hashed assets are immutable for a year: the filename changes on every
#     build, so there is never a reason to revalidate;
#   • index.html is never cached, or a deploy would leave browsers pointing at
#     asset hashes that no longer exist.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx already knows its version; announcing it only helps scanners.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Defence in depth. CloudFront adds these too, but a direct hit to the
    # origin must not be less protected than one through the CDN.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|avif|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # SPA fallback: every unmatched path renders the app, which then routes.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Requests for a missing asset must 404, not silently return index.html:
    # otherwise a bad import shows up as a confusing MIME-type error.
    location ~* \.(?:js|css|map)$ {
        try_files $uri =404;
    }
}
