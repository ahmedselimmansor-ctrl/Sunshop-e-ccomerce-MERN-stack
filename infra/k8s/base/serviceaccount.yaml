apiVersion: v1
kind: ServiceAccount
metadata:
  name: sunshop-api
  namespace: sunshop
  annotations:
    # IRSA: the pod assumes this IAM role via a projected web-identity token.
    # No AWS keys exist anywhere in the cluster: the role is what grants S3,
    # SES and Secrets Manager access, and it is scoped to this service account.
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/sunshop-api-irsa
    eks.amazonaws.com/sts-regional-endpoints: "true"
automountServiceAccountToken: true
