apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunshop-api
  namespace: sunshop
  labels:
    app.kubernetes.io/name: sunshop-api
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take capacity below the current replica count during a deploy.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sunshop-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunshop-api
        app.kubernetes.io/component: api
      annotations:
        # Restart pods when the non-secret config changes; the ExternalSecret
        # refreshes on its own interval and the app re-reads on reconnect.
        checksum/config: "REPLACED_BY_KUSTOMIZE"
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sunshop-api

      # Spread replicas across availability zones before packing a second one
      # onto the same node: a single-AZ outage must not take the API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sunshop-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sunshop-api

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # Give in-flight requests time to finish after the pod is de-registered
      # from the target group. Must exceed the app's own drain delay.
      terminationGracePeriodSeconds: 45

      containers:
        - name: api
          image: ACCOUNT.dkr.ecr.eu-central-1.amazonaws.com/sunshop-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: sunshop-api-config
            - secretRef:
                name: sunshop-api-secrets

          env:
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              # No CPU limit on purpose: CFS throttling at the limit adds
              # latency spikes that look like application problems. The request
              # guarantees a floor; the HPA handles sustained load.
              memory: 640Mi

          # Liveness checks only that the process is responsive: it must not
          # depend on MongoDB, or a database blip would restart the entire
          # fleet simultaneously and turn a recoverable incident into an outage.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness does check dependencies: a pod that cannot reach Mongo
          # should stop receiving traffic without being killed.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # Allows a slow first connection without weakening liveness.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20

          lifecycle:
            preStop:
              exec:
                # Pause before SIGTERM so the ALB finishes de-registering this
                # target; otherwise the last few requests hit a closing socket.
                command: ["sh", "-c", "sleep 5"]

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        # The root filesystem is read-only, so anything that needs to write
        # (Node's temp files) gets an explicit emptyDir.
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
