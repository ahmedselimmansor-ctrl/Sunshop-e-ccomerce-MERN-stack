apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunshop-web
  namespace: sunshop
  labels:
    app.kubernetes.io/name: sunshop-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sunshop-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunshop-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ACCOUNT.dkr.ecr.eu-central-1.amazonaws.com/sunshop-web:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # nginx writes its temp and pid files; with a read-only root these
            # need explicit writable mounts.
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /tmp }
      volumes:
        - name: cache
          emptyDir: { sizeLimit: 64Mi }
        - name: run
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sunshop-web
  namespace: sunshop
spec:
  selector:
    app.kubernetes.io/name: sunshop-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
