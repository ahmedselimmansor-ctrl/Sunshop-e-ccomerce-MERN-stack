apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sunshop

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - external-secrets.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - jobs.yaml

# `labels` rather than the deprecated `commonLabels`: these are descriptive
# labels only and must not be injected into Deployment selectors, which are
# immutable once a Deployment exists.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: sunshop
      app.kubernetes.io/managed-by: kustomize

# Generated rather than declared as a plain resource, so the name carries a
# content hash and overlays can merge extra keys into it.
configMapGenerator:
  - name: sunshop-api-config
    envs:
      - api-config.env

images:
  - name: ACCOUNT.dkr.ecr.eu-central-1.amazonaws.com/sunshop-api
    newTag: latest
  - name: ACCOUNT.dkr.ecr.eu-central-1.amazonaws.com/sunshop-web
    newTag: latest
  - name: ACCOUNT.dkr.ecr.eu-central-1.amazonaws.com/sunshop-admin
    newTag: latest
