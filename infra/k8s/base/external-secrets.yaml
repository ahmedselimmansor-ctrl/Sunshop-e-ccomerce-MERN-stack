# Secrets never live in git: not even encrypted. The External Secrets Operator
# pulls them from AWS Secrets Manager into a Kubernetes Secret and refreshes it
# on an interval, so rotating a database password in Secrets Manager propagates
# without a commit or a manual kubectl.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: sunshop
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          # Same IRSA identity as the workload; no static credentials.
          serviceAccountRef:
            name: sunshop-api
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sunshop-api-secrets
  namespace: sunshop
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: sunshop-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: MONGO_URI
      remoteRef: { key: sunshop/prod/docdb, property: uri }
    - secretKey: REDIS_URL
      remoteRef: { key: sunshop/prod/redis, property: url }
    - secretKey: ELASTICSEARCH_NODE
      remoteRef: { key: sunshop/prod/opensearch, property: endpoint }
    - secretKey: ELASTICSEARCH_USERNAME
      remoteRef: { key: sunshop/prod/opensearch, property: username }
    - secretKey: ELASTICSEARCH_PASSWORD
      remoteRef: { key: sunshop/prod/opensearch, property: password }
    - secretKey: JWT_ACCESS_SECRET
      remoteRef: { key: sunshop/prod/jwt, property: accessSecret }
    - secretKey: JWT_REFRESH_SECRET
      remoteRef: { key: sunshop/prod/jwt, property: refreshSecret }
    - secretKey: FIELD_ENCRYPTION_KEY
      remoteRef: { key: sunshop/prod/encryption, property: fieldKey }
    - secretKey: STRIPE_SECRET_KEY
      remoteRef: { key: sunshop/prod/stripe, property: secretKey }
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef: { key: sunshop/prod/stripe, property: webhookSecret }
    - secretKey: STRIPE_PUBLISHABLE_KEY
      remoteRef: { key: sunshop/prod/stripe, property: publishableKey }
    - secretKey: METRICS_TOKEN
      remoteRef: { key: sunshop/prod/observability, property: metricsToken }
    - secretKey: CLOUDFRONT_KEY_PAIR_ID
      remoteRef: { key: sunshop/prod/cloudfront, property: keyPairId }
    - secretKey: CLOUDFRONT_PRIVATE_KEY
      remoteRef: { key: sunshop/prod/cloudfront, property: privateKey }
