<!doctype html>
<html lang="en" dir="ltr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sunshop</title>
    <meta name="description" content="Sunshop: clothing, electronics and home goods." />
    <meta name="theme-color" content="#f59e0b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      /**
       * Applies the stored theme and direction before first paint.
       *
       * Deliberately inline and synchronous: doing this in React means the
       * browser paints the light theme first and then repaints dark, which is
       * the flash every dark-mode implementation gets wrong once.
       */
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('sunshop-ui') || '{}').state || {};
          var theme = stored.theme || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
          var locale = stored.locale || (navigator.language || 'en').slice(0, 2);
          if (locale !== 'ar' && locale !== 'en') locale = 'en';
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
        } catch (error) {
          /* storage unavailable: fall through to defaults */
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <noscript>Sunshop requires JavaScript. / يتطلب صن شوب تفعيل الجافاسكريبت.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
