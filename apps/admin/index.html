<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sunshop Admin</title>
    <!-- The dashboard is staff-only and must never be indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('sunshop-admin-ui') || '{}').state || {};
          var theme = stored.theme || 'system';
          if (
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
          // Mirrors detectInitialLocale() in stores/ui.ts. Without it a first
          // visit from an Arabic browser painted LTR, then flipped to RTL once
          // React mounted.
          var locale =
            stored.locale ||
            (function () {
              var langs = [localStorage.getItem('sunshop-admin-language')].concat(
                navigator.languages || [navigator.language] || [],
              );
              for (var i = 0; i < langs.length; i++) {
                var base = (langs[i] || '').split('-')[0].toLowerCase();
                if (base === 'ar' || base === 'en') return base;
              }
              return 'en';
            })();
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === 'ar' ? 'rtl' : 'ltr';
        } catch (error) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
