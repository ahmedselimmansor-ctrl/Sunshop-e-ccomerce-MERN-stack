# ─────────────────────────────────────────────────────────────────────────────
# Sunshop: local development stack.
#
# Mirrors the managed AWS services used in production, so code paths exercised
# on a laptop are the same ones that run in EKS:
#
#   mongo    → Amazon DocumentDB       redis  → Amazon ElastiCache
#   elasticsearch → ECK on EKS         minio  → Amazon S3 (+ CloudFront)
#   mailhog  → Amazon SES
#
#   docker compose up -d                    # data services only
#   docker compose --profile apps up -d     # + api, web and admin containers
#   docker compose --profile tools up -d    # + kibana and redis-commander
#
# Host ports are parameterised (MONGO_HOST_PORT, REDIS_HOST_PORT, …) so this
# stack can run alongside another project already holding 6379 or 27017:
#   REDIS_HOST_PORT=6380 docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

name: sunshop

services:
  mongo:
    image: mongo:7.0
    container_name: sunshop-mongo
    restart: unless-stopped
    # A single-node replica set, not a standalone: transactions (checkout,
    # inventory reservation) require one, and developing without them would
    # hide a whole class of bug until production.
    command: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: sunshop
    volumes:
      - mongo-data:/data/db
      - ./infra/docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: sunshop-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      # Cache entries are evictable; sessions are not, so `allkeys-lru` would be
      # wrong. `volatile-lru` only evicts keys that carry a TTL.
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch 8, matching the `@elastic/elasticsearch` client the API uses.
  #
  # A note on AWS: Amazon's managed offering is *OpenSearch*, which forked from
  # Elasticsearch 7.10 and which the v8 Elastic client deliberately refuses to
  # talk to (it checks for an `X-Elastic-Product` header OpenSearch does not
  # send). Sunshop therefore runs Elasticsearch itself: on EKS via the ECK
  # operator in production (see infra/k8s/search/): rather than pretending the
  # two are drop-in compatible. Switching to Amazon OpenSearch Service is a
  # supported alternative but requires the `@opensearch-project/opensearch`
  # client; see docs/architecture.md#search.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: sunshop-search
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      # Local only. Production runs with TLS and API-key authentication.
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.ml.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${SEARCH_HOST_PORT:-9200}:9200"
    volumes:
      - search-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: sunshop-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the media bucket and makes it publicly readable, which is
  # what CloudFront + a bucket policy do in production.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: sunshop-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/sunshop-media-dev &&
      mc anonymous set download local/sunshop-media-dev &&
      echo 'bucket ready'
      "

  mailhog:
    image: axllent/mailpit:v1.21
    container_name: sunshop-mail
    restart: unless-stopped
    ports:
      - "${SMTP_HOST_PORT:-1025}:1025" # SMTP
      - "${MAIL_UI_HOST_PORT:-8025}:8025" # web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # ── Application containers (profile: apps) ────────────────────────────────

  api:
    build:
      context: .
      dockerfile: infra/docker/server.Dockerfile
      target: runner
    container_name: sunshop-api
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      elasticsearch: { condition: service_started }
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/sunshop?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: sunshop-media-dev
      CDN_BASE_URL: http://localhost:9000/sunshop-media-dev
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MAIL_DRIVER: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      JWT_ACCESS_SECRET: dev-only-access-secret-change-me-0000000000000000
      JWT_REFRESH_SECRET: dev-only-refresh-secret-change-me-000000000000000
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:4000/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api/v1
        VITE_CDN_URL: http://localhost:9000/sunshop-media-dev
    container_name: sunshop-web
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:8080"

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api/v1
        VITE_CDN_URL: http://localhost:9000/sunshop-media-dev
    container_name: sunshop-admin
    profiles: ["apps"]
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5174:8080"

  # ── Optional dashboards (profile: tools) ──────────────────────────────────

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: sunshop-kibana
    profiles: ["tools"]
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sunshop-redis-ui
    profiles: ["tools"]
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"

volumes:
  mongo-data:
  redis-data:
  search-data:
  minio-data:
